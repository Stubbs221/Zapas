<html lang="ru"><head><meta charset="utf-8"><title>Zapas — тестовая вкладка</title><link rel="stylesheet" href="style.css"></head>

<h1>Тестовая вкладка Zapas</h1>
<p>Это специально созданная страница для проверки tabs.discard. После активации выгруженная страница загружается заново.</p>
